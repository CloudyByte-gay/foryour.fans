name: foryour-fans

x-node-app: &node-app
  build:
    context: ../..
    dockerfile: infrastructure/docker/app.Dockerfile
  working_dir: /app
  restart: unless-stopped
  # Single source of truth for dev config is the repo-root .env (same file
  # `pnpm dev:*` reads on the host). required:false so a fresh checkout with
  # no .env still boots on the per-service `environment:` values below. Each
  # service then overrides ONLY the settings that must use in-network
  # hostnames — "localhost" points at the container itself in Docker.
  env_file:
    - path: ../../.env
      required: false
  volumes:
    - ../..:/app
    - pnpm-store:/app/.pnpm-store
    - root-node-modules:/app/node_modules
    - api-node-modules:/app/apps/api/node_modules
    - web-node-modules:/app/apps/web/node_modules
    - atproto-node-modules:/app/packages/atproto/node_modules
    - auth-node-modules:/app/packages/auth/node_modules
    - content-node-modules:/app/packages/content/node_modules
    - database-node-modules:/app/packages/database/node_modules
    - discovery-node-modules:/app/packages/discovery/node_modules
    - lexicons-node-modules:/app/packages/lexicons/node_modules
    - media-node-modules:/app/packages/media/node_modules
    - shared-node-modules:/app/packages/shared/node_modules
    - subscriptions-node-modules:/app/packages/subscriptions/node_modules
    - next-cache:/app/apps/web/.next

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: foryour_fans
      POSTGRES_PASSWORD: foryour_fans
      POSTGRES_DB: foryour_fans
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foryour_fans"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: foryour_fans
      MINIO_ROOT_PASSWORD: foryour_fans_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *node-app
    command: >
      sh -c "corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @foryour-fans/database run generate &&
      pnpm -r --workspace-concurrency=1 --filter './packages/**' run --if-present build &&
      pnpm --filter @foryour-fans/database run migrate:deploy &&
      pnpm dev:api"
    environment:
      # Everything else (ports, S3 creds, OAuth mode, feature flags, the
      # CONTENT_KEY_WRAP_SECRET dev value, etc.) comes from ../../.env.
      # These override it with Docker-network hostnames only.
      NODE_ENV: development
      DATABASE_URL: postgresql://foryour_fans:foryour_fans@postgres:5432/foryour_fans
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Separate long-lived Jetstream consumer (apps/api/src/ingest.ts) — never
  # started by the api service itself (see its own doc comment: it must be
  # exactly one always-on process, not scaled with API replicas). Without
  # this running, IndexedCreatorProfile/IndexedPost/IndexedTier stay empty
  # forever and /discover + /search + the marketing page's featured-creators
  # section never populate, no matter how many creators sign up and publish.
  # Depends on `api` (not just postgres/redis) so it starts only after api's
  # one-time install/generate/build/migrate steps on the shared volumes have
  # finished — it then just runs the watch script directly.
  ingest:
    <<: *node-app
    command: >
      sh -c "corepack enable &&
      pnpm --filter @foryour-fans/api run dev:ingest"
    environment:
      # LOG_LEVEL, JETSTREAM_URL, INDEX_BSKY_POSTS come from ../../.env.
      NODE_ENV: development
      DATABASE_URL: postgresql://foryour_fans:foryour_fans@postgres:5432/foryour_fans
      REDIS_URL: redis://redis:6379
    depends_on:
      api:
        condition: service_healthy

  web:
    <<: *node-app
    command: >
      sh -c "corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @foryour-fans/web exec next dev -H 0.0.0.0"
    environment:
      # NEXT_PUBLIC_SITE_URL (browser-facing, identical in both modes)
      # comes from ../../.env.
      NODE_ENV: development
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  pnpm-store:
  root-node-modules:
  api-node-modules:
  web-node-modules:
  atproto-node-modules:
  auth-node-modules:
  content-node-modules:
  database-node-modules:
  discovery-node-modules:
  lexicons-node-modules:
  media-node-modules:
  shared-node-modules:
  subscriptions-node-modules:
  next-cache:

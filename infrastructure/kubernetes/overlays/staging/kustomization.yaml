apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: foryour-fans-staging

resources:
  - ../../base
  - api-env-config.yaml

# `api-secrets` (real DATABASE_URL/REDIS_URL/S3 credentials/
# ATPROTO_OAUTH_PRIVATE_KEY) is NOT created by this overlay — it must
# already exist in the foryour-fans-staging namespace before `kubectl apply
# -k` here, provisioned by whatever secrets mechanism this deployment uses
# (see base/api-secret.example.yaml's header comment and README.md's
# "Kubernetes deployment" section). Unlike overlays/development, staging has
# no safe "these are already public dev defaults" excuse for committing one.

images:
  # A real pipeline sets these to the actual built/pushed digest or release
  # tag for this environment (e.g. `kustomize edit set image` in CI) rather
  # than a fixed string committed here — "staging" stands in as a reminder,
  # not a claim that image `:staging` gets rebuilt automatically. The web
  # image specifically must be built with
  # `--build-arg NEXT_PUBLIC_SITE_URL=https://staging.foryour.fans` (see
  # infrastructure/docker/web.Dockerfile's ARG) — that value is inlined at
  # build time and cannot be changed by anything in this overlay.
  - name: ghcr.io/foryour-fans/api
    newTag: staging
  - name: ghcr.io/foryour-fans/web
    newTag: staging

patches:
  - target:
      kind: Ingress
      name: foryour-fans
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.foryour.fans
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.foryour.fans
      - op: replace
        path: /spec/tls/0/secretName
        value: foryour-fans-staging-tls

# NODE_ENV is "development", not "production" — deliberately. Staging exists
# to exercise hosted AT OAuth (a real PUBLIC_URL, a real
# ATPROTO_OAUTH_PRIVATE_KEY) against real external Postgres/Redis/S3, but
# apps/api/src/config/env.ts's production guard refuses to boot
# NODE_ENV=production with PAYMENT_PROVIDER/PAYOUT_PROVIDER="fake" — and
# "fake" is the ONLY value either enum accepts today (no real
# adult-content-compatible processor has been selected yet — see
# prompts/full.md's Phase 6 note). Setting NODE_ENV=production here would
# just crash-loop the pod for a reason that has nothing to do with staging
# readiness. This is the same honest "not deployable for real money yet"
# fact overlays/production documents and deliberately does not work around.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-env-config
data:
  NODE_ENV: "development"
  PUBLIC_URL: "https://staging.foryour.fans"
  CORS_ORIGIN: "https://staging.foryour.fans"
  ATPROTO_OAUTH_MODE: "hosted"
  PAYMENT_PROVIDER: "fake"
  PAYOUT_PROVIDER: "fake"
  # Real bucket, not MinIO — see api-secret.example.yaml for the credential
  # half of this (S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY stay in the Secret).
  S3_ENDPOINT: "https://CHANGEME.staging-bucket.example.com"
  S3_REGION: "auto"
  S3_BUCKET: "foryour-fans-staging"
  S3_FORCE_PATH_STYLE: "false"

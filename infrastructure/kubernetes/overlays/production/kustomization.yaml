apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: foryour-fans

resources:
  - ../../base
  - api-env-config.yaml

# Same requirement as overlays/staging: `api-secrets` must already exist in
# the target namespace, provisioned out of band — never committed. See
# base/api-secret.example.yaml and README.md's "Kubernetes deployment"
# section. Production additionally requires a REAL ATPROTO_OAUTH_PRIVATE_KEY
# and, before any real subscriber payment flows, the real
# PaymentProvider/PayoutProvider prerequisite api-env-config.yaml's own
# comment documents.

images:
  # See overlays/staging's equivalent comment — a real pipeline sets these,
  # this is a placeholder/reminder. The web image build-arg requirement is
  # the same: `--build-arg NEXT_PUBLIC_SITE_URL=https://foryour.fans`.
  - name: ghcr.io/foryour-fans/api
    newTag: production
  - name: ghcr.io/foryour-fans/web
    newTag: production

replicas:
  - name: api
    count: 3
  - name: web
    count: 3

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target:
      kind: HorizontalPodAutoscaler
      name: web
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target:
      kind: PodDisruptionBudget
      name: api
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
  - target:
      kind: PodDisruptionBudget
      name: web
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
  - target:
      kind: Ingress
      name: foryour-fans
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: foryour.fans
      - op: replace
        path: /spec/tls/0/hosts/0
        value: foryour.fans
      - op: replace
        path: /spec/tls/0/secretName
        value: foryour-fans-tls

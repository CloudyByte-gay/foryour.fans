# Unlike base/api-secret.example.yaml (a template, never applied), this one
# IS a real, applied Secret — but its values are the SAME already-public,
# non-sensitive dev-only credentials already committed in .env.example and
# infrastructure/docker/docker-compose.yml (postgres/foryour_fans,
# redis with no auth, MinIO's dev root user). Nothing here is a real
# secret; pointing at dev-postgres/dev-redis/dev-minio (this overlay's own
# convenience datastores — see dev-datastores.yaml) is what makes it safe to
# commit. Never copy this pattern into overlays/staging or overlays/production.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://foryour_fans:foryour_fans@dev-postgres:5432/foryour_fans"
  REDIS_URL: "redis://dev-redis:6379"
  S3_ACCESS_KEY_ID: "foryour_fans"
  S3_SECRET_ACCESS_KEY: "foryour_fans_dev"
  ATPROTO_OAUTH_PRIVATE_KEY: ""
  CONTENT_KEY_WRAP_SECRET: "dev_only_content_key_wrap_secret_"
  ADMIN_DIDS: ""

# The Phase 10 AT-network ingestion worker (dist/ingest.js) — a long-lived
# Jetstream WebSocket consumer, not an HTTP request handler. Deliberately a
# SEPARATE Deployment from api-deployment.yaml, sharing the same image, so
# that scaling the HTTP server's replica count never multiplies firehose
# consumers — see apps/api/src/ingest.ts's own doc comment, which explicitly
# names this manifest as the thing that used to be a "known, documented gap"
# before Phase 16.
#
# replicas is pinned at 1 and MUST stay 1: JetstreamIngestor has no
# partitioning/leader-election story, so a second replica would double-index
# every commit event, not add throughput. There is no Service for this
# Deployment (it exposes no port) and no liveness/readiness probe — it has
# no HTTP surface to probe, and JetstreamIngestor already owns its own
# reconnect/backoff for the one failure mode (the Jetstream connection
# dropping) that doesn't already mean the process itself has exited, which
# a normal container restart already handles.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-ingest
  labels:
    app.kubernetes.io/name: api-ingest
    app.kubernetes.io/component: ingestion-worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    # Never run two ingest pods at once, even transiently during a rollout
    # — see the doc comment above on why a second consumer double-indexes.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: api-ingest
      app.kubernetes.io/component: ingestion-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-ingest
        app.kubernetes.io/component: ingestion-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-ingest
          image: ghcr.io/foryour-fans/api:latest
          imagePullPolicy: IfNotPresent
          # See api-deployment.yaml's comment — the runtime image's WORKDIR
          # is the monorepo root, not apps/api.
          command: ["node", "apps/api/dist/ingest.js"]
          envFrom:
            - configMapRef:
                name: api-config
            - configMapRef:
                name: api-env-config
            - secretRef:
                name: api-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30

# TEMPLATE ONLY — every value below is a placeholder, never a real secret.
# This file is intentionally NOT listed in kustomization.yaml's `resources`,
# so `kubectl apply -k` never applies it. Real secrets are created out of
# band (a secrets manager integration — Sealed Secrets, External Secrets
# Operator, Vault, or your CI/CD's own secret injection — or, at minimum,
# `kubectl create secret generic api-secrets --from-literal=...` run by an
# operator, never committed to git). See README.md's "Kubernetes deployment"
# section. The Deployments in this directory reference a Secret named
# `api-secrets` via `envFrom`; whatever mechanism creates it just needs to
# produce a Secret with this name and these keys in the target namespace.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://CHANGEME:CHANGEME@CHANGEME:5432/foryour_fans"
  REDIS_URL: "redis://CHANGEME:6379"
  S3_ACCESS_KEY_ID: "CHANGEME"
  S3_SECRET_ACCESS_KEY: "CHANGEME"
  # Only required when ATPROTO_OAUTH_MODE=hosted (staging/production) — see
  # apps/api/src/config/env.ts. Never generate or set this for the
  # development overlay, which uses loopback mode and needs no key.
  ATPROTO_OAUTH_PRIVATE_KEY: "CHANGEME"
  # Only required when CREATOR_OWNED_GATED_CONTENT_ENABLED=true, which is
  # never true outside local development today — see api-configmap.yaml's
  # comment and docs/creator-owned-pds.md §4/§7. Left as a placeholder so
  # the key exists in the template even though no overlay turns the flag on.
  CONTENT_KEY_WRAP_SECRET: "CHANGEME_use_at_least_16_random_chars"
  # Comma-separated DIDs promoted to ADMIN on login (Phase 14) — sensitive
  # in the sense that it's a privilege grant, not a traditional credential.
  # Empty by default; an operator sets this to their own DID(s) once.
  ADMIN_DIDS: ""
